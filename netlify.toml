[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# הגשר: מהארון אל הלימוד — data/ של הארון מוגש מאותו מקור (בלי CORS)
[[redirects]]
  from = "/shelf-data/*"
  to = "https://aquamarine-muffin-1c019d.netlify.app/data/:splat"
  status = 200
  force = true

# אפליקציית המובייל קוראת את ה-proxy מ-capacitor://localhost — כותרות CORS
[[headers]]
  for = "/shelf-data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
